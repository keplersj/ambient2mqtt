[project]
name = "ambient2mqtt"
version = "0.4.0"
description = "Bridge Ambient Smart Home (Level) devices to MQTT with Home Assistant autodiscovery"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kepler Sticka-Jones" }]
keywords = ["mqtt", "home-assistant", "ambient", "level", "smart-home", "bridge"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
]
dependencies = [
    "httpx[http2]>=0.27",
    "paho-mqtt>=2.0",
]

[project.urls]
Homepage = "https://github.com/keplersj/ambient2mqtt"
Repository = "https://github.com/keplersj/ambient2mqtt"
Issues = "https://github.com/keplersj/ambient2mqtt/issues"

[project.scripts]
ambient2mqtt = "ambient2mqtt.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
