# Example: run ambient2mqtt against your own MQTT broker.
# Copy .env.example to .env and fill in your Ambient credentials first.
services:
  ambient2mqtt:
    image: ghcr.io/keplersj/ambient2mqtt:latest
    restart: unless-stopped
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
    ports:
      - "9100:9100" # /metrics, /healthz, /readyz
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/readyz', timeout=5)"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    depends_on:
      - mosquitto

  mosquitto:
    image: docker.io/library/eclipse-mosquitto:2
    restart: unless-stopped
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    ports:
      - "1883:1883"
