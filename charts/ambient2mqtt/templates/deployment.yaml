apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ambient2mqtt.fullname" . }}
  labels:
    {{- include "ambient2mqtt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ambient2mqtt.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ambient2mqtt.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ambient2mqtt
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ include "ambient2mqtt.secretName" . }}
          env:
            - name: MQTT_HOST
              value: {{ .Values.mqtt.host | quote }}
            - name: MQTT_PORT
              value: {{ .Values.mqtt.port | quote }}
            - name: MQTT_TLS
              value: {{ .Values.mqtt.tls | quote }}
            - name: BASE_TOPIC
              value: {{ .Values.bridge.baseTopic | quote }}
            - name: DISCOVERY_PREFIX
              value: {{ .Values.bridge.discoveryPrefix | quote }}
            - name: SYNC_INTERVAL
              value: {{ .Values.bridge.syncInterval | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.bridge.logLevel | quote }}
            - name: DEVICE_OVERRIDES
              value: {{ .Values.bridge.deviceOverrides | toJson | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
