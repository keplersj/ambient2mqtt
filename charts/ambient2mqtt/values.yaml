image:
  repository: ghcr.io/keplersj/ambient2mqtt
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Ambient credentials. Reference an existing Secret with keys AMBIENT_USERNAME /
# AMBIENT_PASSWORD (and optionally MQTT_USERNAME / MQTT_PASSWORD). This is the
# recommended path for GitOps (e.g. created by External Secrets).
ambient:
  existingSecret: ambient2mqtt-secrets
  # Or set create=true to render a Secret from the values below (not recommended
  # for committed GitOps; fine for quick local installs).
  create: false
  username: ""
  password: ""

mqtt:
  host: mosquitto
  port: 1883
  tls: false

bridge:
  baseTopic: ambient2mqtt
  discoveryPrefix: homeassistant
  syncInterval: 30
  logLevel: INFO
  # "text" or "json" (one JSON object per line; easier to query in Loki).
  logFormat: text
  # Re-type devices Ambient misreports, e.g. a switch driving a fan.
  # Map of deviceId -> "fan" | "switch" | "light".
  deviceOverrides: {}

# Prometheus /metrics plus /healthz and /readyz, all on one port. Disabling this also
# removes the probes, since they share the endpoint.
metrics:
  enabled: true
  port: 9100
  service:
    annotations: {}
  # Requires the Prometheus Operator CRDs (kube-prometheus-stack, or Grafana Alloy's
  # prometheus.operator.servicemonitors component).
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# Alerts for the Prometheus Operator: bridge down, sync stale, MQTT disconnected,
# login failures, failing commands. Needs serviceMonitor (or another scrape config that
# sets job=<release fullname>).
prometheusRule:
  enabled: false
  labels: {}
  for: 5m
  syncStaleSeconds: 300
  additionalRules: []

# Grafana dashboard as a ConfigMap, for the Grafana sidecar (kube-prometheus-stack and the
# grafana chart watch for the grafana_dashboard label). The JSON is also usable standalone:
# charts/ambient2mqtt/dashboards/ambient2mqtt.json
grafana:
  dashboard:
    enabled: false
    # Defaults to the release namespace; set it if your sidecar only watches one namespace.
    namespace: ""
    labels:
      grafana_dashboard: "1"
    # e.g. grafana_folder: Home
    annotations: {}

livenessProbe:
  httpGet:
    path: /healthz
    port: metrics
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# Not ready until MQTT is connected and a sync succeeded within ~3 sync intervals.
readinessProbe:
  httpGet:
    path: /readyz
    port: metrics
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 2

# Extra container env, e.g. OTEL_* settings.
extraEnv: []

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 96Mi
  limits:
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
