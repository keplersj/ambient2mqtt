name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A PAT (or GitHub App token) makes the tag/release that release-please
          # creates attributable to a real identity, so the tag push triggers
          # release.yaml and the image + chart publish automatically. Without the
          # secret it falls back to GITHUB_TOKEN: the release PR still works, but a
          # tag it pushes won't trigger release.yaml (push a tag by hand instead).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
