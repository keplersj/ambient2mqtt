name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived GitHub App installation token. A token other than the
      # default GITHUB_TOKEN is required so the tag/release release-please creates
      # triggers release.yaml (which publishes the image + chart) -- GitHub does not
      # run workflows off events created by GITHUB_TOKEN. A GitHub App token is used
      # instead of a PAT so there is no expiring secret to rotate.
      #
      # Configure once: create a GitHub App with Contents: read/write and Pull
      # requests: read/write, install it on this repo, then set the repo variable
      # RELEASE_APP_ID and the secret RELEASE_APP_PRIVATE_KEY (see CONTRIBUTING.md).
      # Until then this step is skipped and release-please falls back to GITHUB_TOKEN
      # (the release PR works; cut releases by pushing a tag by hand).
      - id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
